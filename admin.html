<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração do Cardápio</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <header class="topo">

        <div>

            <h1>🍴 Cardápio</h1>

            <p>Painel administrativo</p>

        </div>

    </header>


    <main>

        <!-- =====================================
             ADICIONAR PRATO
        ====================================== -->

        <section class="painel">

            <div class="titulo">

                <h2>Novo prato</h2>

                <p>
                    Preencha as informações para adicionar um prato.
                </p>

            </div>


            <form id="formPrato">


                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Hambúrguer artesanal"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="preco">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        placeholder="25.90"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <div class="campo campo-grande">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        placeholder="Descreva o prato..."
                    ></textarea>

                </div>


                <div class="campo">

                    <label for="categoria">
                        Categoria
                    </label>

                    <select id="categoria" required>

                        <option value="">
                            Escolha uma categoria
                        </option>

                        <option value="Entradas">
                            Entradas
                        </option>

                        <option value="Pratos Principais">
                            Pratos Principais
                        </option>

                        <option value="Bebidas">
                            Bebidas
                        </option>

                        <option value="Sobremesas">
                            Sobremesas
                        </option>

                    </select>

                </div>


                <div class="campo campo-grande">

                    <label for="imagem">
                        URL da imagem
                    </label>

                    <input
                        type="url"
                        id="imagem"
                        placeholder="https://..."
                    >

                </div>


                <button
                    type="submit"
                    id="botaoAdicionar"
                >
                    + Adicionar prato
                </button>


            </form>

        </section>


        <!-- =====================================
             PRATOS CADASTRADOS
        ====================================== -->

        <section class="painel">

            <div class="titulo">

                <h2>Pratos cadastrados</h2>

                <p>
                    Pratos atualmente armazenados no Supabase.
                </p>

            </div>


            <div id="listaPratos">

                <p class="carregando">
                    Carregando...
                </p>

            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
